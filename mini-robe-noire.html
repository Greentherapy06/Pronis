  <noscript><link rel="stylesheet" href="style.css"></noscript>

  <script src="cart.js" defer></script>

  <style>
    .product-page{
      padding-top:160px;
      padding-bottom:120px;
      display:flex;
      justify-content:center;
      width:100%;
    }

    .product-container{
      max-width:1050px;
      display:flex;
      gap:80px;
      align-items:flex-start;
      padding:0 20px;
    }

    .product-image-frame{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:20px;
      align-items:center;
    }

    .product-image-frame img{
      width:100%;
      max-width:450px;
      border-radius:12px;
      object-fit:cover;
      box-shadow:0 8px 40px rgba(0,0,0,0.12);
      transition:0.4s ease;
    }

    .product-details{
      flex:1;
      max-width:450px;
      text-align:left;
    }

    .product-title{font-size:34px;font-weight:300;margin-bottom:10px;}
    .product-subtitle{font-size:15px;color:#555;margin-bottom:25px;line-height:1.6;}
    .product-price{font-size:26px;color:#C9A86A;margin-bottom:25px;}

    .add-to-cart{
      background:none;
      border:none;
      font-size:12px;
      letter-spacing:4px;
      padding:14px 0;
      cursor:pointer;
      color:#C9A86A;
    }

    .size-options{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:25px;}
    .size-options input{display:none;}

    .size-options label{
      padding:12px 18px;
      border:1px solid rgba(201,168,106,0.35);
      cursor:pointer;
      color:#C9A86A;
    }

    .size-options input:checked + label{
      background:#caa86a;
      color:#000;
    }
  </style>

</head>

<body>

<header class="lux-header">
  <a href="index.html" class="header-logo-link">
    <img src="les-jardins-enchantes.webp" alt="Les Jardins Enchantés">
  </a>

  <button class="lux-cart" onclick="showCart()">
    PANIER (<span id="cartCount">0</span>)
  </button>
</header>

<section class="product-page">
<div class="product-container">

  <div class="product-details">

    <h1 class="product-title">Mini robe noire sexy extensible – J Lingerie</h1>

    <p class="product-subtitle">
      Robe moulante ultra glamour avec dos nu plongeant.
    </p>

    <p class="product-price">49,95 €</p>

    <div class="size-options">
      <input type="radio" name="size" id="s" value="S"><label for="s">S</label>
      <input type="radio" name="size" id="m" value="M"><label for="m">M</label>
      <input type="radio" name="size" id="l" value="L"><label for="l">L</label>
      <input type="radio" name="size" id="xl" value="XL"><label for="xl">XL</label>
    </div>

    <!-- ✅ CORRECTION IMPORTANTE ICI -->
    <button
      class="add-to-cart"
      data-price-s="price_1TbJIHF9c1lWA0HyICYqgUFx"
      data-price-m="price_1TbL8hF9c1lWA0HyVa3mRc8V"
      data-price-l="price_1TbLANF9c1lWA0Hyxtek6tJo"
      data-price-xl="price_1TbLCLF9c1lWA0HyGhqehFvC"
      data-product-name="Mini robe noire sexy extensible"
      onclick="addToCartWithSize(this)">
      AJOUTER AU PANIER
    </button>

  </div>

</div>
</section>

<script>
function addToCartWithSize(btn) {

  const size = document.querySelector('input[name="size"]:checked');

  if (!size) {
    alert("Choisis une taille");
    return;
  }

  let priceId = "";

  if (size.value === "S") priceId = btn.dataset.priceS;
  if (size.value === "M") priceId = btn.dataset.priceM;
  if (size.value === "L") priceId = btn.dataset.priceL;
  if (size.value === "XL") priceId = btn.dataset.priceXL;

  // 👉 ENVOI VERS TON CART
  addToCart(priceId, size.value, btn.dataset.productName);
}
</script>

</body>
</html>
