  <script src="cart.js" defer></script>

  <style>
    .product-page{padding-top:160px;padding-bottom:120px;display:flex;justify-content:center;width:100%;}
    .product-container{max-width:1050px;display:flex;gap:80px;align-items:flex-start;padding:0 20px;}
    .product-image-frame{flex:1;display:flex;flex-direction:column;gap:20px;align-items:center;}
    .product-image-frame img{width:100%;max-width:450px;border-radius:12px;object-fit:cover;box-shadow:0 8px 40px rgba(0,0,0,0.12);transition:0.4s;}
    .product-image-frame img:hover{transform:scale(1.03);}
    .product-details{flex:1;max-width:450px;text-align:left;}
    .product-title{font-size:34px;font-weight:300;margin-bottom:10px;}
    .product-subtitle{font-size:15px;color:#555;margin-bottom:25px;line-height:1.6;}
    .product-price{font-size:26px;color:#C9A86A;margin-bottom:25px;}
    .add-to-cart{background:none;border:none;font-size:12px;letter-spacing:4px;padding:14px 0;cursor:pointer;color:#C9A86A;}
    .add-to-cart:hover{letter-spacing:5px;}
    .size-options{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:25px;}
    .size-options input{display:none;}
    .size-options label{padding:12px 18px;border:1px solid rgba(201,168,106,0.35);font-size:11px;cursor:pointer;color:#C9A86A;}
    .size-options input:checked + label{background:#caa86a;color:#000;}
  </style>

</head>

<body>

<header class="lux-header">
  <a href="index.html">
    <img src="les-jardins-enchantes.webp" alt="logo" width="158">
  </a>

  <button class="lux-cart" onclick="showCart()">
    PANIER (<span id="cartCount">0</span>)
  </button>
</header>

<section class="product-page">

<div class="product-container">

  <div class="product-image-frame">
    <img src="Mini robe noire.jpg">
    <img src="Mini robe noire1.jpg">
    <img src="Mini robe noire2.jpg">
    <img src="Mini robe noire3.jpg">
    <img src="Mini robe noire4.jpg">
  </div>

  <div class="product-details">

    <h1 class="product-title">Mini robe noire sexy extensible – J Lingerie</h1>

    <p class="product-subtitle">
      Robe moulante ultra glamour avec dos nu plongeant.
    </p>

    <p class="product-price">49,95 €</p>

    <div class="size-options">
      <input type="radio" name="size" id="s" value="S"><label for="s">S</label>
      <input type="radio" name="size" id="m" value="M"><label for="m">M</label>
      <input type="radio" name="size" id="l" value="L"><label for="l">L</label>
      <input type="radio" name="size" id="xl" value="XL"><label for="xl">XL</label>
    </div>

    <button
      class="add-to-cart"
      data-price-ids='{"S":"price_1TbJIHF9c1lWA0HyICYqgUFx","M":"price_1TbL8hF9c1lWA0HyVa3mRc8V","L":"price_1TbLANF9c1lWA0Hyxtek6tJo","XL":"price_1TbLCLF9c1lWA0HyGhqehFvC"}'
      data-product-name="Mini robe noire sexy extensible"
      data-product-price="49.95"
      onclick="addToCartWithSize(event)">
      AJOUTER AU PANIER
    </button>

  </div>

</div>

</section>

<script>
function addToCartWithSize(event) {

  const button = event.currentTarget;

  // 1. récupération taille fiable
  const size = document.querySelector('input[name="size"]:checked')?.value;

  if (!size) {
    alert("⚠️ Choisis une taille");
    return;
  }

  // 2. parse sécurisé des price IDs
  const priceIds = JSON.parse(button.dataset.priceIds);

  // 3. mapping correct
  const priceId = priceIds[size];

  if (!priceId) {
    console.error("Price ID introuvable pour:", size);
    return;
  }

  console.log("SIZE:", size);
  console.log("PRICE ID:", priceId);

  // 👉 ici tu continues ton add to cart / stripe
  // example:
  // stripe.redirectToCheckout({ lineItems: [{ price: priceId, quantity: 1 }] });
}
</script>
